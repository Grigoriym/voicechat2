services:
  srt:
    build: .
    container_name: voicechat2-srt
    restart: unless-stopped
    network_mode: host
    command: uvicorn srt-server:app --host 127.0.0.1 --port 8001
    environment:
      SRT_ENGINE: webservice
      WHISPER_WEBSERVICE_URL: http://localhost:9001/asr
      WHISPER_LANGUAGE: de

  tts:
    build: .
    container_name: voicechat2-tts
    restart: unless-stopped
    network_mode: host
    command: uvicorn tts-server-piper:app --host 127.0.0.1 --port 8003
    environment:
      PIPER_BIN: /piper/piper/piper
      PIPER_MODEL: /piper/voices/de_DE-thorsten-high.onnx
    volumes:
      - /home/gregory/data/piper:/piper:ro

  vc2:
    build: .
    container_name: voicechat2-vc2
    restart: unless-stopped
    network_mode: host
    command: uvicorn voicechat2:app --host 0.0.0.0 --port 8010
    environment:
      SRT_ENDPOINT: http://localhost:8001/inference
      LLM_ENDPOINT: http://localhost:11434/v1/chat/completions
      LLM_MODEL: llama3.1:8b
      OLLAMA_BASE: http://localhost:11434
      TTS_ENDPOINT: http://localhost:8003/tts
      # Check-on-demand runs Claude via the `claude` CLI on the user's own
      # subscription (see CLAUDE.md). ~/.local/bin/claude is a symlink into
      # ~/.local/share/claude/versions/, so both dirs are mounted at their
      # host paths: the symlink resolves, and a Claude Code self-update on
      # the host is picked up without rebuilding.
      CLAUDE_BIN: /home/gregory/.local/bin/claude
      DISABLE_AUTOUPDATER: "1"
    # CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token` (git-ignored).
    env_file: .env
    volumes:
      - /home/gregory/.local/bin:/home/gregory/.local/bin:ro
      - /home/gregory/.local/share/claude:/home/gregory/.local/share/claude:ro
    depends_on:
      - srt
      - tts

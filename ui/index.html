<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voicechat2 — Setup</title>

    <link rel="stylesheet" href="/ui/css/theme.css">
    <link rel="stylesheet" href="/ui/css/setup.css">
    <script src="/ui/js/theme.js"></script>
</head>
<body>
    <div class="page">
        <div class="page-inner">
            <div class="page-header">
                <h1>voicechat2</h1>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
            </div>
            <div class="lang-badge">🇩🇪 German — Whisper (STT) → Ollama (LLM) → Piper (TTS)</div>

            <div class="card">
                <div class="card-header">
                    <h2>Conversation context</h2>
                    <button id="newScenarioBtn" class="btn-secondary" type="button">+ New scenario</button>
                </div>
                <div id="scenarioList">loading…</div>

                <div id="scenarioForm" class="scenario-form" hidden>
                    <h3 id="scenarioFormTitle">New scenario</h3>
                    <label for="scenarioNameInput">Name</label>
                    <input type="text" id="scenarioNameInput" placeholder="e.g. Ordering coffee">
                    <label for="scenarioPromptInput">Prompt</label>
                    <textarea id="scenarioPromptInput" rows="4" placeholder="Describe the role-play scenario for the model..."></textarea>
                    <div class="form-actions">
                        <button id="scenarioFormSave" class="btn-primary" type="button">Save</button>
                        <button id="scenarioFormCancel" class="btn-secondary" type="button">Cancel</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Model</h2>
                </div>
                <div class="model-group">
                    <label for="modelSelect">Conversation model</label>
                    <div class="model-row">
                        <select id="modelSelect"><option>loading…</option></select>
                        <button id="unloadModelBtn" class="btn-secondary" type="button">Free GPU memory</button>
                    </div>
                    <span id="modelStatus" class="status-hint"></span>
                </div>
                <div class="model-group">
                    <label for="grammarModelSelect">Grammar corrector model</label>
                    <div class="model-row">
                        <select id="grammarModelSelect"><option>loading…</option></select>
                    </div>
                    <span id="grammarModelStatus" class="status-hint"></span>
                </div>
                <div class="model-group">
                    <label for="explainerModelSelect">Explainer model</label>
                    <div class="model-row">
                        <select id="explainerModelSelect"><option>loading…</option></select>
                    </div>
                    <span id="explainerModelStatus" class="status-hint"></span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Health check</h2>
                    <button id="recheckHealthBtn" class="btn-secondary" type="button">Re-check</button>
                </div>
                <div id="healthPanel">
                    <div class="health-row" data-check="ollama">
                        <span class="health-label">Ollama (LLM)</span>
                        <span id="healthOllamaBadge" class="badge badge-neutral">checking…</span>
                    </div>
                    <div class="health-row" data-check="srt">
                        <span class="health-label">Whisper (STT)</span>
                        <span id="healthSrtBadge" class="badge badge-neutral">checking…</span>
                    </div>
                    <div class="health-row" data-check="tts">
                        <span class="health-label">Piper (TTS)</span>
                        <span id="healthTtsBadge" class="badge badge-neutral">checking…</span>
                    </div>
                    <div class="health-row" data-check="mic">
                        <span class="health-label">Microphone</span>
                        <span id="healthMicBadge" class="badge badge-neutral">checking…</span>
                    </div>
                </div>
                <div id="micMeterWrap" class="meter-wrap" hidden>
                    <div class="meter-track"><div id="micMeterFill" class="meter-fill"></div></div>
                    <div id="micMeterHint" class="meter-hint"></div>
                </div>
            </div>

            <button id="startBtn" class="btn-primary btn-start" type="button" disabled>Start conversation</button>
        </div>
    </div>
    <script src="/ui/js/setup.js"></script>
</body>
</html>
